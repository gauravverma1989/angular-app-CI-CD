<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <div class="login-mark">A</div>
    <p class="eyebrow">ADMINISTRATION</p>
    <h1 id="login-title">Welcome back</h1>
    <p class="login-intro">Sign in to manage profiles and roles.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        formControlName="email"
        placeholder="admin@example.com"
      />
      <small class="field-error" *ngIf="form.controls.email.touched && form.controls.email.invalid">
        Enter a valid email address.
      </small>

      <label for="password">Password</label>
      <div class="password-field">
        <input
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          autocomplete="current-password"
          formControlName="password"
          placeholder="Your password"
        />
        <button
          class="password-toggle"
          type="button"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="showPassword"
          (click)="showPassword = !showPassword"
        >
          <svg *ngIf="showPassword" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <svg *ngIf="!showPassword" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.8M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7c1 0 2-.2 2.9-.5" />
            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
          </svg>
        </button>
      </div>
      <small class="field-error" *ngIf="form.controls.password.touched && form.controls.password.invalid">
        Password is required.
      </small>

      <p class="error-message" role="alert" *ngIf="errorMessage">{{ errorMessage }}</p>
      <button
        class="resend-verification"
        type="button"
        *ngIf="canResendVerification"
        [disabled]="resendingVerification"
        (click)="resendVerification()"
      >
        {{ resendingVerification ? 'Sending…' : 'Resend verification email' }}
      </button>
      <p class="resend-message" role="status" *ngIf="resendMessage">{{ resendMessage }}</p>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </section>
</main>
